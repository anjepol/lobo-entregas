apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: lobo-entregas
spec:
  replicas: 3
  selector:
    matchLabels: { app: auth-service }
  template:
    metadata:
      labels: { app: auth-service }
    spec:
      containers:
        - name: auth-service
          image: ghcr.io/anjepol/lobo-entregas-auth-service:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 3001 }]
          env:
            - { name: MONGO_URL, value: "mongodb://mongo:27017/lobo_auth" }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: lobo-secrets, key: JWT_SECRET } }
          readinessProbe:
            httpGet: { path: /health, port: 3001 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 3001 }
            initialDelaySeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: lobo-entregas
spec:
  type: NodePort
  selector: { app: auth-service }
  ports: [{ port: 3001, targetPort: 3001, nodePort: 30001 }]
