apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: lobo-entregas
spec:
  replicas: 3
  selector:
    matchLabels: { app: order-service }
  template:
    metadata:
      labels: { app: order-service }
    spec:
      containers:
        - name: order-service
          image: ghcr.io/anjepol/lobo-entregas-order-service:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 3003 }]
          env:
            - { name: MONGO_URL, value: "mongodb://mongo:27017/lobo_orders" }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: lobo-secrets, key: JWT_SECRET } }
          readinessProbe:
            httpGet: { path: /health, port: 3003 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 3003 }
            initialDelaySeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: lobo-entregas
spec:
  type: NodePort
  selector: { app: order-service }
  ports: [{ port: 3003, targetPort: 3003, nodePort: 30003 }]
